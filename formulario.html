<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de registro</title>

</head>
<body>
    <main class="contenedor">
        <h1>Formulario de registro</h1><br>
        <p class="subtitulo">Completa todos los campos para validar tus datos.</p>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" maxlength="100"
                   placeholder="Ej.Brianny" required>
            <small id="errorNombre" class="error"></small><br>

            <label for="paterno">Apellido paterno</label>
            <input type="text" id="paterno" maxlength="100"
                   placeholder="Ej.Martinez" required></form>
            <small id="errorPaterno" class="error"></small><br>

            <label for="materno">Apellido materno</label>
            <input type="text" id="materno" maxlength="100"
                   placeholder="Ej. Ríos" required>
            <small id="errorMaterno" class="error"></small><br>

            <label for="edad">Edad</label>
            <input type="text" id="edad" maxlength="3" inputmode="numeric"
                   placeholder="Ej. 16" required>
            <small id="errorEdad" class="error"></small><br>

            <label for="fecha">Fecha de nacimiento</label>
            <input type="date"
            id="fecha"
            name="fecha"
            min="1900-01-01"
            max="2026-12-31"
            required>

            <label for="tarjeta">Número de tarjeta</label>
            <input
            type="text" 
            id="tarjeta"
            name="tarjeta"
            placeholder="1234567890123456"
            inputmode="numeric"
            maxlength="16"
            pattern="[0-9]{16}"
            required>
                   
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" maxlength="254"
                   placeholder="ejemplo@correo.com" required>
            <small id="errorEmail" class="error"></small><br>
<center>
<a href="confirmado.html" style="display: inline-block;background: #8B5E3C; color: white; padding: 12px 30px; border-radius: 12px; text-decoration: none; font-weight: bold;">Validar el pago</a>

        </form>
        <script>
        document.getElementById("miFormulario").addEventLivstener("submit",function(event) {
        	event.preventDefaul();

        	if (this.checkValidity()){
        		window.location.href="confirmado.html";
        	} 
        });


    </main>
    </script src="script.js"></script>
    <link rel="stylesheet" type="text/css" href="estilos.css"></link>
    <form id="formulario" novalidate=""></form>
    </body>
    </html>
